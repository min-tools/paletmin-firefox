<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- Match Chrome's slash, with a transparent gap through the A glyph. -->
  <defs>
    <mask id="slash-gap" maskUnits="userSpaceOnUse" x="0" y="0" width="32" height="32">
      <rect width="32" height="32" fill="white"/>
      <path d="M6 26 L26 6" stroke="black" stroke-width="7" stroke-linecap="round"/>
    </mask>
  </defs>
  <style>
    #slash { stroke: #474747; }
    #dark-toolbar { display: none; }
    @media (prefers-color-scheme: dark) {
      #slash { stroke: #c7c7c7; }
      #light-toolbar { display: none; }
      #dark-toolbar { display: inline; }
    }
  </style>
  <g mask="url(#slash-gap)">
  <image id="light-toolbar" width="32" height="32" href="data:image/png;base64,"/>
  <image id="dark-toolbar" width="32" height="32" href="data:image/png;base64,"/>
  </g>
  <path id="slash" d="M6 26 L26 6" fill="none" stroke-width="3" stroke-linecap="round"/>
</svg>
