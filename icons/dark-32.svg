<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- Keep the original raster glyphs; Firefox selects the toolbar scheme. -->
  <style>
    #dark-toolbar { display: none; }
    @media (prefers-color-scheme: dark) {
      #light-toolbar { display: none; }
      #dark-toolbar { display: inline; }
    }
  </style>
  <image id="light-toolbar" width="32" height="32" href="data:image/png;base64,"/>
  <image id="dark-toolbar" width="32" height="32" href="data:image/png;base64,"/>
</svg>
